# Tandem production stack for one Vultr instance: Caddy (HTTPS) in front of
# the web dashboard and the MCP server. Convex Cloud hosts the backend.
# Runbook: docs/deploy.md.
#
# From the repo root, with the root `.env` (never committed):
#   docker compose -f deploy/compose.yml --env-file .env up -d --build
#
# Root `.env`:
#   WEB_DOMAIN=app.example.com              # DNS A record -> this instance
#   MCP_DOMAIN=mcp.example.com              # DNS A record -> this instance
#   ACME_EMAIL=ops@example.com              # Let's Encrypt account/expiry notices
#   NEXT_PUBLIC_CONVEX_URL=https://<prod>.convex.cloud   # baked into the web image
#   NEXT_PUBLIC_MCP_URL=https://mcp.example.com          # shown on the Assistants page
#   CONVEX_URL=https://<prod>.convex.cloud               # read by the MCP server at runtime
#   TANDEM_ALLOWED_ORIGINS=                 # optional; browser origins allowed to call /mcp
#
# Paths are relative to this file (deploy/), so the build context `..` is the
# repo root, which both Dockerfiles need for `turbo prune`.

# Pinned so volumes are tandem_caddy_data etc. regardless of the checkout path.
name: tandem

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
      mcp: { condition: service_healthy }
    # The only internet-facing container: no privileges beyond binding 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME state; losing these re-issues certs (rate limits apply).
      - caddy_data:/data
      - caddy_config:/config

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:?set NEXT_PUBLIC_CONVEX_URL}
        NEXT_PUBLIC_DEFAULT_WORKSPACE_ID: ${NEXT_PUBLIC_DEFAULT_WORKSPACE_ID:-}
        NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-}
    image: tandem-web
    restart: unless-stopped
    # NEXT_PUBLIC_* values are inlined at build time, including in the proxy and
    # auth code, so there's no runtime env here. Rebuild the image to change them.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Not published on the host: Caddy reaches it as web:3000.
    expose: ["3000"]
    healthcheck:
      # Health status only (Docker doesn't restart unhealthy containers; restart:
      # covers crashes). /api/health doesn't touch Convex.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    image: tandem-mcp
    restart: unless-stopped
    # Read at runtime; no rebuild needed to point at another deployment.
    environment:
      CONVEX_URL: ${CONVEX_URL:?set CONVEX_URL}
      TANDEM_ALLOWED_ORIGINS: ${TANDEM_ALLOWED_ORIGINS:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # Not published on the host: Caddy reaches it as mcp:8787.
    expose: ["8787"]
    healthcheck:
      # Health status only (Docker doesn't restart unhealthy containers; restart:
      # covers crashes). /healthz doesn't touch Convex.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
